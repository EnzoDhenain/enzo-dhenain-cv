<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mon CV</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      background-color: #000000 !important;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: Arial, sans-serif;
    }

    .carte {
      width: 300px;
      height: 400px;
      perspective: 1000px;
    }

    .interieur {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.8s ease;
    }

    .carte.retournee .interieur {
      transform: rotateY(180deg);
    }

    .face {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      border-radius: 20px;
      overflow: hidden;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .face img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .dos {
      transform: rotateY(180deg);
    }

    #bouton {
      display: block;
      margin-top: 30px;

      padding: 14px 35px;

      background-color: #ffffff !important;
      color: #000000 !important;

      border: 0;
      border-radius: 30px;

      font-size: 18px;
      font-weight: bold;

      cursor: pointer;
    }

    #bouton:hover {
      opacity: 0.85;
    }
  </style>
</head>

<body>
  <h1 style="color:red;">VERSION TEST</h1>

<img src="photo-dos.jpg" style="width:300px; display:block; margin:20px;">

<img src="Capture d’écran 2026-04-11 à 11.58.24.png" style="width:300px; display:block; margin:20px;">

<div class="carte" id="carte">

    <div class="interieur">

      <div class="face">
        <img src="photo-dos.jpg" alt="Photo 1">
      </div>

      <div class="face dos">
  <img
    src="Capture%20d%E2%80%99%C3%A9cran%202026-04-11%20%C3%A0%2011.58.24.png"
    alt="Photo 2"
  >
</div>

    </div>

  </div>

  <button id="bouton">Retourner</button>

  <script>
    const carte = document.getElementById("carte");
    const bouton = document.getElementById("bouton");

    bouton.addEventListener("click", function () {
      carte.classList.toggle("retournee");
    });
  </script>

</body>
</html>
