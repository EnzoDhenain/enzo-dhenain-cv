<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mon CV - Carte interactive</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #191919;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 30px 20px;
    }

    .card-container {
      width: min(90vw, 500px);
      aspect-ratio: 3 / 4;
      perspective: 1200px;
      cursor: pointer;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.7s ease;
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;

      border-radius: 18px;
      overflow: hidden;

      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;

      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    .card-face img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-back {
      transform: rotateY(180deg);
    }

    .button {
      margin-top: 25px;

      background: #ffffff;
      color: #191919;

      border: none;
      border-radius: 10px;

      padding: 12px 22px;

      font-size: 15px;
      font-weight: 600;

      cursor: pointer;

      transition: all 0.2s ease;
    }

    .button:hover {
      background: #e8e8e8;
      transform: translateY(-2px);
    }

    .instruction {
      margin-top: 14px;

      color: #8f8f8f;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="card-container" onclick="flipCard()">
    <div class="card" id="card">

      <div class="card-face">
        <img src="Photo%20CV%20.jpg" alt="Photo CV">
      </div>

      <div class="card-face card-back">
        <img src="Capture%20d%E2%80%99e%CC%81cran%202026-04-11%20a%CC%80%2011.58.24.png" alt="Présentation">
      </div>

    </div>
  </div>

  <button class="button" onclick="flipCard(event)">
    ↻ Retourner
  </button>
  

  <script>
    function flipCard(event) {
      if (event) {
        event.stopPropagation();
      }

      document.getElementById("card").classList.toggle("flipped");
    }
  </script>

</body>
</html>
