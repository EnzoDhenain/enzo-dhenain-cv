<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ma carte interactive</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: white;
    }

    .carte {
      width: 300px;
      height: 400px;
      perspective: 1000px;
      cursor: pointer;
    }

    .interieur {
      width: 100%;
      height: 100%;
      position: relative;
      transition: transform 0.7s ease;
      transform-style: preserve-3d;
    }

    .carte.retournee .interieur {
      transform: rotateY(180deg);
    }

    .face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 20px;
      overflow: hidden;
    }

    .face img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .dos {
      transform: rotateY(180deg);
    }
  </style>
</head>

<body>

  <div class="carte" id="carte">
    <div class="interieur">

      <!-- PHOTO AVANT -->
      <div class="face">
        <img src="photo-dos.jpg" alt="Photo">
      </div>

      <!-- PHOTO ARRIÈRE -->
      <div class="face dos">
        <img src="Capture d’écran 2026-04-11 à 11.58.24.png" alt="Photo">
      </div>

    </div>
  </div>

  <script>
    const carte = document.getElementById("carte");

    carte.addEventListener("click", function () {
      carte.classList.toggle("retournee");
    });
  </script>

</body>
</html>
