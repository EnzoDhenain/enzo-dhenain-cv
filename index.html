<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Carte photo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: white;
    }

    .carte {
      width: 300px;
      height: 400px;
      perspective: 1000px;
      cursor: pointer;
    }

    .contenu {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.7s ease;
    }

    .carte.retournee .contenu {
      transform: rotateY(180deg);
    }

    .face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 20px;
      overflow: hidden;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .face img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .arriere {
      transform: rotateY(180deg);
    }
  </style>
</head>

<body>

  <div class="carte" id="carte">

    <div class="contenu">

      <!-- PREMIÈRE PHOTO -->
      <div class="face">
        <img src="photo-dos.jpg" alt="Photo 1">
      </div>

      <!-- DEUXIÈME PHOTO -->
      <div class="face arriere">
        <img src="photo-2.png" alt="Photo">
      </div>

    </div>

  </div>

  <script>
    const carte = document.getElementById("carte");

    carte.addEventListener("click", function () {
      carte.classList.toggle("retournee");
    });
  </script>

</body>
</html>
