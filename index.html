<!DOCTYPE html>

<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon CV - Carte interactive</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f2f2f2;
      font-family: Arial, sans-serif;
    }

    .container {
      text-align: center;
    }

    .card {
      width: 360px;
      height: 500px;
      perspective: 1200px;
      margin: 0 auto 25px;
      cursor: pointer;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.8s;
      transform-style: preserve-3d;
    }

    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 20px;
      overflow: hidden;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
      background: white;
    }

    .card-face img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .card-back {
      transform: rotateY(180deg);
    }

    button {
      border: none;
      padding: 13px 28px;
      border-radius: 30px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }

    button:hover {
      transform: scale(1.05);
      opacity: 0.9;
    }

    button:active {
      transform: scale(0.98);
    }

    .instruction {
      margin-top: 12px;
      color: #666;
      font-size: 14px;
    }

    @media (max-width: 450px) {
      .card {
        width: 300px;
        height: 420px;
      }
    }
  </style>

</head>

<body>

  </div>

  <script>
    const card = document.getElementById("card");
    const button = document.getElementById("flipButton");

    function flipCard() {
      card.classList.toggle("flipped");

      if (card.classList.contains("flipped")) {
        button.textContent = "↻ Retourner";
      } else {
        button.textContent = "↻ Retourner";
      }
    }

    card.addEventListener("click", flipCard);
    button.addEventListener("click", flipCard);
  </script>
