<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mon CV</title>

  <style>

    /* =========================
       PAGE
    ========================= */

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      background: #000000;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      font-family: Arial, sans-serif;
    }


    /* =========================
       CARTE
    ========================= */

    .carte {
      width: 300px;
      height: 400px;

      perspective: 1200px;

      cursor: pointer;
    }


    /* =========================
       ELEMENT QUI TOURNE
    ========================= */

    .interieur {
      position: relative;

      width: 100%;
      height: 100%;

      transform-style: preserve-3d;

      transition: transform 0.8s ease;
    }


    /* =========================
       ROTATION
    ========================= */

    .carte.retournee .interieur {
      transform: rotateY(180deg);
    }


    /* =========================
       FACES
    ========================= */

    .face {
      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      border-radius: 20px;

      background: #ffffff;

      border: 4px solid #ffffff;

      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }


    /* =========================
       PHOTOS
    ========================= */

    .face img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;
    }


    /* =========================
       DEUXIÈME FACE
    ========================= */

    .dos {
      transform: rotateY(180deg);
    }


    /* =========================
       BOUTON
    ========================= */

    #bouton {
      margin-top: 30px;

      padding: 14px 32px;

      background: #ffffff;
      color: #000000;

      border: none;
      border-radius: 30px;

      font-size: 17px;
      font-weight: bold;

      cursor: pointer;

      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.25);

      transition: transform 0.2s ease,
                  opacity 0.2s ease;
    }


    #bouton:hover {
      transform: scale(1.05);
    }


    #bouton:active {
      transform: scale(0.95);
    }

  </style>
</head>


<body>


  <!-- =========================
       CARTE
  ========================= -->

  <div class="carte" id="carte">

    <div class="interieur">


      <!-- PREMIÈRE PHOTO -->

      <div class="face">

        <img
          src="photo-dos.jpg"
          alt="Photo 1"
        >

      </div>


      <!-- DEUXIÈME PHOTO -->

      <div class="face dos">

        <img
          src="Capture d’écran 2026-04-11 à 11.58.24.png"
          alt="Photo 2"
        >

      </div>


    </div>

  </div>


  <!-- =========================
       BOUTON
  ========================= -->

  <button id="bouton">
    RETOURNER
  </button>


  <!-- =========================
       JAVASCRIPT
  ========================= -->

  <script>

    const carte = document.getElementById("carte");
    const bouton = document.getElementById("bouton");


    bouton.addEventListener("click", function () {

      carte.classList.toggle("retournee");

    });

  </script>


</body>
</html>
