<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mon profil</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 25px;
      font-family: Arial, sans-serif;
    }

    /* CARTE */
    .carte {
      width: 300px;
      height: 400px;
      perspective: 1200px;
    }

    .carte-interieur {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.8s ease;
    }

    /* Rotation */
    .carte.retournee .carte-interieur {
      transform: rotateY(180deg);
    }

    /* LES DEUX FACES */
    .face {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;

      border-radius: 20px;
      overflow: hidden;

      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    /* IMAGES */
    .face img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    /* DOS */
    .dos {
      transform: rotateY(180deg);
    }

    /* BOUTON */
    button {
      border: none;
      background: white;
      color: black;

      padding: 12px 25px;
      border-radius: 30px;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;

      transition: transform 0.2s ease,
                  opacity 0.2s ease;
    }

    button:hover {
      transform: scale(1.05);
    }

    button:active {
      transform: scale(0.95);
    }
  </style>
</head>

<body>

  <!-- CARTE -->
  <div class="carte" id="carte">

    <div class="carte-interieur">

      <!-- PHOTO 1 -->
      <div class="face">
        <img
          src="photo-dos.jpg"
          alt="Photo 1"
        >
      </div>

      <!-- PHOTO 2 -->
      <div class="face dos">
        <img
          src="Capture d’écran 2026-04-11 à 11.58.24.png"
          alt="Photo 2"
        >
      </div>

    </div>

  </div>

  <!-- BOUTON -->
  <button id="bouton">
    Retourner
  </button>

  <script>
    const carte = document.getElementById("carte");
    const bouton = document.getElementById("bouton");

    bouton.addEventListener("click", function () {
      carte.classList.toggle("retournee");
    });
  </script>

</body>
</html>
